name: Build LumiSync APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Keep debug signing consistent for future test updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lumisync-debug-signing-v1
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LumiSync-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  ui-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LumiSync-debug-apk
          path: apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check installed screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install apk/app-debug.apk
            python3 scripts/ui_smoke.py
      - name: Upload UI check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LumiSync-ui-checks
          path: ui-checks/
